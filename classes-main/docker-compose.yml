version: '3.8'

# Docker Compose конфигурация для проекта Simulator Backend
# Включает: Web, Redis, PostgreSQL, Celery, Celery Beat, Tests

services:
  # ============================================================================
  # WEB СЕРВЕР (Django + Gunicorn)
  # ============================================================================
  web:
    build: .
    container_name: simulator-web
    volumes:
      - .:/app
      - logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DEBUG=True
      - SECRET_KEY=django-insecure-dev-key-for-docker
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/simulator_db
      # Redis configuration - separate DBs for Celery (0) and Cache (1)
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      # Monitoring URLs for health checks
      - PROMETHEUS_URL=http://prometheus:9090
      - GRAFANA_URL=http://grafana:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "
      echo '⏳ Waiting for database...' &&
      python manage.py migrate --noinput &&
      echo '✅ Migrations done!' &&
      python manage.py seed_learning &&
      echo '✅ Seeding done!' &&
      gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend-network

  # ============================================================================
  # REDIS (для кэширования и очереди задач)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: simulator-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  # ============================================================================
  # PostgreSQL DATABASE
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: simulator-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=simulator_db
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  # ============================================================================
  # PROMETHEUS (metrics scraping)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: simulator-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      web:
        condition: service_started
    networks:
      - backend-network

  # ============================================================================
  # GRAFANA (dashboard and alerts)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: simulator-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_SIGNOUT_MENU=true
      - GF_DEFAULT_APP_MODE=view
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - backend-network

  # ============================================================================
  # LOCUST (load testing)
  # ============================================================================
  locust:
    build: .
    container_name: simulator-locust
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/simulator_db
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - web
    command: python -m locust -f /app/locustfile.py --host=http://web:8000 --web-host=0.0.0.0
    ports:
      - "8089:8089"
    networks:
      - backend-network

  # ============================================================================
  # CELERY WORKER (для асинхронных задач)
  # ============================================================================
  celery:
    build: .
    container_name: simulator-celery
    volumes:
      - .:/app
      - logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/simulator_db
      # Redis configuration - Celery uses DB 0
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
    depends_on:
      - redis
      - db
      - web
    command: celery -A core worker --loglevel=info --concurrency=4
    networks:
      - backend-network

  # ============================================================================
  # CELERY BEAT (для расписания задач)
  # ============================================================================
  celery-beat:
    build: .
    container_name: simulator-celery-beat
    volumes:
      - .:/app
      - logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/simulator_db
      # Redis configuration - Celery Beat uses DB 0
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
    depends_on:
      - redis
      - db
      - web
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - backend-network

  # ============================================================================
  # PYTEST (для запуска тестов производительности и юнит тестов)
  # ============================================================================
  test:
    build: .
    container_name: simulator-test
    volumes:
      - .:/app
      - logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/simulator_db
      # Redis configuration - Tests use separate DB for cache
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
    depends_on:
      - redis
      - db
    command: pytest tests/performance/test_cache_performance.py -s -v --cov=. --cov-report=html --cov-report=term-missing
    networks:
      - backend-network

# ============================================================================
# VOLUMES (для persistence данных)
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  logs:
    driver: local
  grafana_data:
    driver: local

# ============================================================================
# NETWORKS (для связи между контейнерами)
# ============================================================================
networks:
  backend-network:
    driver: bridge
