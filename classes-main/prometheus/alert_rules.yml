groups:
  - name: django_alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: rate(simulator_http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for the last 5 minutes"

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(simulator_http_request_duration_seconds_bucket[5m])) by (le)) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency"
          description: "95th percentile latency is {{ $value }}s (threshold: 1s)"

      - alert: ServerDown
        expr: up{job="django"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Simulator backend server is down"
          description: "The Django application at {{ $labels.instance }} has been unreachable for 1 minute"

      - alert: RequestExceptions
        expr: rate(simulator_http_request_exceptions_total[5m]) > 0.01
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High exception rate"
          description: "Request exception rate is {{ $value }} per second"
