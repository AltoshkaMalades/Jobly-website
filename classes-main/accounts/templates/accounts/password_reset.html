{% extends 'accounts/base.html' %}
{% block content %}
<div class="max-w-md mx-auto my-20 p-8 bg-white rounded-3xl border border-neutral-100 shadow-sm">
    <h2 class="text-2xl font-bold mb-6">Восстановление пароля</h2>
    <p class="text-neutral-500 mb-6 text-sm">Введите ваш email, и мы отправим вам инструкции по установке нового пароля.</p>
    <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
            {{ form.as_p }}
            <button type="submit" class="w-full py-4 bg-neutral-900 text-white rounded-2xl font-bold hover:bg-neutral-800 transition-all">
                Отправить письмо
            </button>
        </div>
    </form>
</div>
{% endblock %}
