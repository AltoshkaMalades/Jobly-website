{% extends 'accounts/base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-20 p-8 bg-white rounded-2xl shadow-lg border border-neutral-100 text-center">
    <h2 class="text-2xl font-bold mb-4">Подтверждение почты</h2>
    <p class="text-neutral-500 mb-6">Мы отправили код на вашу почту. Введите его ниже:</p>
    
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <input type="text" name="code" maxlength="6" required 
               class="w-full px-4 py-3 text-center text-2xl tracking-widest border rounded-xl outline-none focus:border-black"
               placeholder="000000">
        <button type="submit" class="w-full py-3 bg-black text-white rounded-xl font-bold hover:bg-neutral-800 transition-all">
            Подтвердить
        </button>
    </form>
</div>
{% endblock %}
