{% extends 'accounts/base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-10 p-8 bg-white rounded-2xl shadow-lg border border-neutral-100">
    <h2 class="text-2xl font-bold mb-6 text-center">Редактирование</h2>
    
    <form method="POST" class="space-y-5">
        {% csrf_token %}
        
        {% for field in form %}
            <div class="flex flex-col gap-2">
                <label class="text-xs font-bold uppercase tracking-widest text-neutral-500">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.errors %}
                    <p class="text-red-500 text-xs">{{ field.errors.as_text }}</p>
                {% endif %}
            </div>
        {% endfor %}

        <div class="flex gap-3 pt-4">
            <button type="submit" 
                class="flex-1 py-3 bg-black text-white rounded-xl font-bold hover:bg-neutral-800 transition-all">
                Сохранить
            </button>
            <a href="{% url 'profile' %}" 
               class="flex-1 py-3 bg-neutral-100 text-center text-neutral-600 rounded-xl font-bold hover:bg-neutral-200 transition-all">
                Отмена
            </a>
        </div>
    </form>
</div>
{% endblock %}
