{% extends 'accounts/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto py-12 px-4">
	<div class="bg-white p-8 rounded-2xl shadow-sm border border-neutral-200">
		<h1 class="text-3xl font-bold text-neutral-900 mb-2">Apply for {{ job.title }}</h1>
		<p class="text-neutral-500 mb-8">{{ job.company }} · {{ job.location }}</p>
		<form method="POST" enctype="multipart/form-data" class="space-y-6">
			{% csrf_token %}
			{% for field in form %}
			<div>
				<label class="block text-sm font-semibold text-neutral-700 mb-2">{{ field.label }}</label>
				{{ field }}
				{% if field.errors %}<p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>{% endif %}
			</div>
			{% endfor %}
			<button type="submit" class="w-full bg-neutral-900 text-white py-4 rounded-xl font-bold">Send application</button>
		</form>
	</div>
</div>
{% endblock %}
