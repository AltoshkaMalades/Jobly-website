{% extends 'accounts/base.html' %}
{% block content %}
<div class="max-w-md mx-auto my-20 p-8 bg-white rounded-3xl border border-neutral-100 shadow-sm">
    <h2 class="text-2xl font-bold mb-6">Придумайте новый пароль</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full py-4 bg-neutral-900 text-white rounded-2xl font-bold">
            Сохранить пароль
        </button>
    </form>
</div>
{% endblock %}
