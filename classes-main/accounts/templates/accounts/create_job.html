{% extends 'accounts/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto py-12 px-4">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-neutral-200">
        <h1 class="text-3xl font-bold text-neutral-900 mb-2">Post a New Job</h1>
        <p class="text-neutral-500 mb-8">Fill in the details to find your next great hire.</p>

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            {% for field in form %}
            <div>
                <label class="block text-sm font-semibold text-neutral-700 mb-2">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.errors %}
                    <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}

            <div class="pt-4">
                <button type="submit" class="w-full bg-neutral-900 text-white py-4 rounded-xl font-bold hover:bg-neutral-800 transition-all shadow-lg active:scale-[0.98]">
                    Publish Opportunity
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
