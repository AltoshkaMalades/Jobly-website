name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: classes-main

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          py -m alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Run tests
        run: |
          python manage.py test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}