name: CI/CD Pipeline

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: classes-main
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run backup and migrations
        run: |
          bash scripts/backup_and_migrate.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_DIR: ./ci-backups
          RETENTION_DAYS: 30

      - name: Run tests
        run: |
          pytest -v
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_TESTING: 1
          REDIS_URL: redis://localhost:6379/0

  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_dump --version
      
      - name: Create backup
        run: |
          mkdir -p backups
          pg_dump "$DATABASE_URL" > backups/backup_$(date +%Y-%m-%d_%H-%M-%S).sql
          echo "✅ Backup created successfully!"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      
      - name: Upload backup as artifact
        uses: actions/upload-artifact@v3
        with:
          name: database-backup-${{ github.run_number }}
          path: backups/
          retention-days: 30